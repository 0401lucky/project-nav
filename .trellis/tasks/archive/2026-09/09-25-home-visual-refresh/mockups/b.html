<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>样稿 B · 玻璃启动器</title>
    <link rel="stylesheet" href="shared/base.css" />
    <style>
      /*
        B 玻璃启动器：所有内容装进左侧一块毛玻璃，像一个常驻的启动器窗口，右侧留给壁纸人物。
        全页只有这一层模糊（现在每个分组各一层，共 9 层）；书签改成紧凑列表，分组三列错落排。
      */
      :root {
        --sheet-w: clamp(620px, 62vw, 980px);
        --wp-scrim: linear-gradient(180deg, rgb(0 0 0 / 0.28), rgb(0 0 0 / 0.04) 35%, rgb(0 0 0 / 0.3));
      }

      .app {
        padding: 22px;
      }

      .sheet {
        display: flex;
        flex-direction: column;
        width: var(--sheet-w);
        height: 100%;
        background: rgb(17 19 26 / 0.5);
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 22px;
        box-shadow: 0 30px 80px rgb(0 0 0 / 0.35);
        backdrop-filter: blur(24px) saturate(1.25);
        overflow: hidden;
      }

      /* 工具条「模糊：关」：同一块面板换成更不透明的纯色底，对比去掉模糊后的观感 */
      .no-blur .sheet {
        background: rgb(15 17 23 / 0.82);
        backdrop-filter: none;
      }

      .sheet .top {
        padding: 0 16px 0 20px;
      }

      .sheet__search {
        padding: 0 16px 14px;
        border-bottom: 1px solid var(--stroke);
      }

      .main {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 14px 16px 20px;
      }

      .panels {
        columns: 3 220px;
        column-gap: 20px;
      }

      .panels__cell {
        break-inside: avoid;
        padding-bottom: 14px;
      }

      .panel__head {
        height: 26px;
        padding: 0 6px;
      }

      .panel__name {
        font-size: 12px;
        color: var(--text-2);
        letter-spacing: 0.08em;
      }

      /* 紧凑列表：一行一条，图标缩到 22px，标题单行截断 */
      .panel__grid {
        display: grid;
        gap: 1px;
      }

      .card {
        gap: 9px;
        padding: 5px 6px;
        border-radius: 8px;
      }

      .card:hover {
        background: rgb(255 255 255 / 0.09);
      }

      .card__icon,
      .fallback {
        width: 22px;
        height: 22px;
        border-radius: 6px;
      }

      .fallback {
        font-size: 11px;
      }

      .card__title {
        -webkit-line-clamp: 1;
      }

      .card__more {
        right: 3px;
      }

      .add-group {
        height: 34px;
      }

      @media (max-width: 640px) {
        .app {
          padding: 0;
        }

        /* 窄屏铺满，模糊降一档 */
        .sheet {
          width: 100%;
          border: none;
          border-radius: 0;
          box-shadow: none;
          backdrop-filter: blur(14px);
        }

        .panels {
          columns: 1;
        }

        /* 窄屏回到三版一致的竖排卡片 */
        .card__icon,
        .fallback {
          width: 32px;
          height: 32px;
          border-radius: 8px;
        }

        .fallback {
          font-size: 15px;
        }

        .card__title {
          -webkit-line-clamp: 2;
        }
      }
    </style>
  </head>
  <body>
    <div class="wp"></div>
    <div class="app"></div>

    <script src="shared/data.js"></script>
    <script src="shared/render.js"></script>
    <script>
      const { DATA, h, panel, addGroupButton, topbar, search, mountWallpaper, mountToolbar } = window.Mock

      mountWallpaper(document.querySelector('.wp'))

      const panels = h('div', { class: 'panels' }, [
        ...DATA.map((group) => panel(group)),
        h('div', { class: 'panels__cell' }, [addGroupButton()]),
      ])

      document.querySelector('.app').append(
        h('div', { class: 'sheet' }, [
          topbar(),
          h('div', { class: 'sheet__search' }, [search()]),
          h('main', { class: 'main' }, [panels]),
        ]),
      )

      mountToolbar(
        'b.html',
        'B 玻璃启动器（已选定）：全部内容装进左侧一块毛玻璃，全页只剩这一层模糊；书签改成紧凑列表，分组三列错落；标题重复的书签在标题下显示主机名。「色块」用来对比首字色块的配色。',
        [
          {
            label: '模糊',
            options: [
              { text: '开', value: true },
              { text: '关', value: false },
            ],
            value: true,
            onChange: (on) => document.body.classList.toggle('no-blur', !on),
          },
          {
            label: '色块',
            options: [
              { text: '现状', value: '' },
              { text: '低饱和', value: 'fb-muted' },
              { text: '中性', value: 'fb-neutral' },
            ],
            value: '',
            onChange: (name) => {
              document.body.classList.remove('fb-muted', 'fb-neutral')
              if (name) document.body.classList.add(name)
            },
          },
          {
            label: '深色图标',
            options: [
              { text: '现状', value: '' },
              { text: '反白', value: '-invert' },
              { text: '底板', value: '-plate' },
            ],
            value: '',
            // 只换判定命中的两个：DEEIX Chat、Google AI Studio；两种效果图是用 sharp 预先生成的
            onChange: (suffix) => {
              for (const img of document.querySelectorAll('img.card__icon')) {
                const match = img.getAttribute('src').match(/^icons\/(8209398a75be|e6304c212833)(?:-invert|-plate)?\.webp$/)
                if (match) img.setAttribute('src', `icons/${match[1]}${suffix}.webp`)
              }
            },
          },
        ],
      )
    </script>
  </body>
</html>
