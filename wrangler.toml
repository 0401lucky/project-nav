name = "nav-aurora"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "NAV_KV"
id = "e1e69313575d4b72bfcc457bee8272b1"

# 健康检测使用"懒检测"：前端 GET /api/health 时若数据陈旧 (>5min)
# 后端用 ctx.waitUntil 异步刷新，不依赖 cron。如果想叠加定时检查，
# 可启用以下配置（Pages cron 在部分账户尚需开启 beta）：
# [triggers]
# crons = ["*/5 * * * *"]

# 以下字段通过 dashboard 或 wrangler pages secret put 设置，不要提交到仓库：
# - EDIT_PASSWORD     编辑模式密码
# - EDIT_SECRET       签发 token 用的随机串（>= 32 字节）
# - OCR_PROVIDER      openai | dashscope | anthropic
# - OCR_API_KEY       对应平台的 API Key
